name: cs-request-portal-idp

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: cs-request-portal-keycloak
    command: ['start-dev', '--import-realm']
    environment:
      # Development credentials for the Keycloak admin console only.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - '8080:8080'
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e "GET / HTTP/1.1\r\n\r\n" >&3']
      interval: 10s
      timeout: 5s
      retries: 12
