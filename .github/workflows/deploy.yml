name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Pages has no backend and no Keycloak to redirect to, so the published
      # artifact is a demo build: MSW answers the API and the session is fixed.
      # The banner in the UI says so. Auth and API wiring stay real everywhere
      # else, including local runs against docker/keycloak.
      - name: Build
        run: pnpm build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ENABLE_API_MOCKS: 'true'
          VITE_DEMO_AUTH: 'true'
          VITE_API_BASE_URL: /api
          # The build refuses to disable authentication unless asked to.
          ALLOW_DEMO_AUTH_BUILD: 'true'

      - name: Performance budget
        run: pnpm budget

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
